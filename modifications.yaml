layers:
  - image: 'images\layers\0_photo.jpg'
    filters:
      - name: gaussianblur
        params:
          window: 5
          sigma: 2.0
  - image: 'images\layers\1_pop_bike.png'
    blend:
      name: darken
      opacity: 0.5
  - image: 'images\layers\2_wall.png'
    filters:
      - name: normal 
    blend:
      name: difference
      opacity: 0.6
  - image: 'images\layers\3_shiny_car.png'
    filters:
      - name: greyscale
    blend:
      name: difference
      opacity: 1.0